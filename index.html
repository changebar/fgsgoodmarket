(function(){
var app=document.getElementById('app');
var chips=document.getElementById('chips');
var q=document.getElementById('q');
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function safe(v){return esc(v).replace(/\\/g,'')}
DATA.brands.forEach(function(b,i){
  var a=document.createElement('a');
  a.href='#b'+i;
  a.textContent=b.name;
  a.onclick=function(){
    chips.querySelectorAll('a').forEach(function(x){x.style.background='';x.style.color=''});
    a.style.background='#166534';a.style.color='#fff';
  };
  chips.appendChild(a);
});
DATA.brands.forEach(function(b,i){
  var sec=document.createElement('section');
  sec.id='b'+i;
  var h=document.createElement('h2');
  var span=document.createElement('span');
  span.textContent=b.name;
  var small=document.createElement('small');
  small.textContent=b.items.length+' 項';
  span.appendChild(document.createTextNode(' '));
  span.appendChild(small);
  h.appendChild(span);
  var btn=document.createElement('a');
  btn.className='btn form';
  btn.href=DATA.form_url;
  btn.target='_blank';
  btn.textContent='前往預購表單';
  btn.style.padding='7px 12px';
  btn.style.fontSize='12px';
  h.appendChild(btn);
  sec.appendChild(h);
  var grid=document.createElement('div');
  grid.className='grid';
  b.items.forEach(function(it){
    var c=document.createElement('article');
    c.className='card';
    var search=(b.name+' '+(it.item||'')+' '+(it.flavor||'')+' '+(it.spec||'')+' '+(it.price||'')).toLowerCase();
    c.setAttribute('data-search',search);
    var photo=document.createElement('div');
    photo.className='photo';
    if(it.photo){
      var img=document.createElement('img');
      img.src=it.photo;
      img.alt=it.item||'';
      img.style.height='auto';
      img.style.width='100%';
      img.style.maxHeight='230px';
      img.style.objectFit='contain';
      img.style.display='block';
      photo.appendChild(img);
    } else {
      var ph=document.createElement('div');
      ph.className='ph';
      ph.textContent='照片待補';
      photo.appendChild(ph);
    }
    c.appendChild(photo);
    var t=document.createElement('div');
    t.className='title';
    t.textContent=b.name+'｜'+(it.item||'');
    c.appendChild(t);
    if(it.flavor){var d=document.createElement('div');d.className='desc';d.textContent=it.flavor;c.appendChild(d);}
    if(it.spec){var s=document.createElement('div');s.className='desc';s.textContent='規格：'+it.spec;c.appendChild(s);}
    if(it.price){var p=document.createElement('div');p.className='price';p.textContent=it.price;c.appendChild(p);}
    if(it.limit||it.note){var n=document.createElement('div');n.className='note';n.textContent=[it.limit,it.note].filter(function(x){return x&&x.trim()}).join('／');c.appendChild(n);}
    grid.appendChild(c);
  });
  sec.appendChild(grid);
  app.appendChild(sec);
});
q.addEventListener('input',function(){
  var v=q.value.trim().toLowerCase();
  document.querySelectorAll('section').forEach(function(sec){
    var any=false;
    sec.querySelectorAll('.card').forEach(function(card){
      var ok=!v||card.getAttribute('data-search').indexOf(v)>=0;
      card.style.display=ok?'':'none';
      if(ok)any=true;
    });
    sec.style.display=any?'':'none';
  });
});
})();
