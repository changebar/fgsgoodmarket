<style>
:root{--brand:#1a5c3a;--brand-light:#e8f5ee;--brand-dark:#0e3d24;--accent:#c8951a;--card:#fff;--bg:#f6f4ef;--text:#222;--muted:#666;--radius:14px;--shadow:0 2px 12px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{background:linear-gradient(135deg,var(--brand-dark),var(--brand));color:#fff;padding:28px 20px 22px;text-align:center}
header h1{font-size:22px;font-weight:700;letter-spacing:1px}
header p{font-size:13px;opacity:.85;margin-top:4px}
header .order-link{display:inline-block;margin-top:14px;background:var(--accent);color:#fff;padding:10px 22px;border-radius:50px;text-decoration:none;font-weight:700;font-size:14px;box-shadow:0 3px 10px rgba(200,149,26,.4)}
.search-bar{position:sticky;top:0;background:var(--bg);z-index:100;padding:12px 16px}
.search-bar input{width:100%;padding:11px 16px;border:2px solid var(--brand-light);border-radius:50px;font-size:14px;outline:none;background:#fff;box-shadow:var(--shadow)}
.search-bar input:focus{border-color:var(--brand)}
.brand-nav{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:54px;z-index:99;-webkit-overflow-scrolling:touch}
.brand-nav a{flex-shrink:0;padding:7px 14px;border-radius:50px;font-size:13px;text-decoration:none;color:var(--muted);background:#f0efe9;white-space:nowrap;border:1px solid transparent}
.brand-nav a.active{background:var(--brand);color:#fff;border-color:var(--brand)}
main{max-width:1100px;margin:0 auto;padding:0 16px 60px}
.brand-section{margin-top:28px}
.brand-title{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:10px;border-bottom:3px solid var(--brand)}
.brand-title .num{background:var(--brand);color:#fff;font-size:13px;font-weight:700;min-width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.brand-title h2{font-size:20px;font-weight:700;color:var(--brand-dark)}
.brand-title .badge{font-size:11px;background:var(--brand-light);color:var(--brand);padding:3px 10px;border-radius:50px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
@media(min-width:768px){.card-grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.card.hidden{display:none}
.card-img-wrap{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:#f0efe9}
.card-img-wrap img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;transition:transform .3s}
.card-img-wrap img:hover{transform:scale(1.04)}
.card-img-wrap .placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e8f5ee,#d4e8dc);color:var(--brand);font-size:13px;font-weight:600;text-align:center;padding:20px}
.card-img-wrap .photo-badge{position:absolute;top:8px;left:8px;background:rgba(26,92,58,.85);color:#fff;font-size:10px;padding:2px 8px;border-radius:20px}
.card-body{padding:12px 14px 14px;flex:1;display:flex;flex-direction:column}
.card-brand{font-size:11px;color:var(--accent);font-weight:700;margin-bottom:3px}
.card-product{font-size:15px;font-weight:700;margin-bottom:4px}
.card-flavor{font-size:12px;color:var(--muted);margin-bottom:6px}
.card-spec{font-size:12px;color:var(--muted);margin-bottom:8px}
.card-spec b{color:var(--text);font-weight:600}
.card-price{font-size:20px;font-weight:800;color:var(--brand-dark);margin-bottom:4px}
.card-price small{font-size:12px;font-weight:400;color:var(--muted)}
.card-pre{font-size:11px;color:var(--muted);background:#f5f5f0;padding:6px 8px;border-radius:8px;margin-bottom:8px}
.card-notes{font-size:11px;color:#8a6d1a;background:#fff8e6;padding:6px 8px;border-radius:8px;margin-bottom:10px}
.card-cta{margin-top:auto}
.card-cta a{display:block;text-align:center;background:var(--brand);color:#fff;padding:10px;border-radius:10px;text-decoration:none;font-size:13px;font-weight:700;transition:background .2s}
.card-cta a:hover{background:var(--brand-dark)}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.lightbox.show{display:flex}
.lightbox img{max-width:95vw;max-height:85vh;object-fit:contain;border-radius:8px}
.lightbox .lb-close{position:absolute;top:20px;right:24px;color:#fff;font-size:28px;cursor:pointer}
.lightbox .lb-caption{color:#fff;font-size:13px;text-align:center}
footer{text-align:center;padding:20px;font-size:12px;color:var(--muted)}
.no-result{display:none;text-align:center;padding:60px 20px;color:var(--muted);font-size:16px}
.no-result.show{display:block}
html{scroll-behavior:smooth}
</style>

const BRANDS = [];
ITEMS.forEach(it => { if(!BRANDS.includes(it.brand)) BRANDS.push(it.brand); });
const nav = document.getElementById("brandNav");
BRANDS.forEach((b,i) => {
  const a = document.createElement("a");
  a.href = "#brand-"+i;
  a.textContent = b.replace(/[｜・]/g,"").trim();
  a.onclick = () => { document.querySelectorAll(".brand-nav a").forEach(x=>x.classList.remove("active")); a.classList.add("active"); };
  nav.appendChild(a);
});
const content = document.getElementById("content");
let html = "";
BRANDS.forEach((b,bi) => {
  const items = ITEMS.filter(it=>it.brand===b);
  html += '<div class="brand-section" id="brand-'+bi+'" data-brand="'+b+'">';
  html += '<div class="brand-title"><div class="num">'+(bi+1)+'</div><h2>'+b+'</h2><div class="badge">'+items.length+'項</div></div>';
  html += '<div class="card-grid">';
  items.forEach(it=>{
    const hasImg = it.images && it.images.length>0;
    let imgHtml;
    if(hasImg){
      imgHtml = '<div class="card-img-wrap"><img src="'+it.images[0]+'" alt="'+it.product+'" onclick="openLB(this)" loading="lazy"><span class="photo-badge">'+it.images.length+'張照片</span></div>';
    } else {
      imgHtml = '<div class="card-img-wrap"><div class="placeholder">'+it.product+'<br><span style="font-size:11px;opacity:.7">（照片待補）</span></div></div>';
    }
    const pre102 = it.pre102 || "";
    const pre103 = it.pre103 || "";
    const notes = (it.notes||"").split("\n").filter(n=>n.trim()&&!n.startsWith("*預購者")).join(" ");
    const flavor = it.flavor ? '<div class="card-flavor">'+it.flavor+'</div>' : "";
    const spec = it.spec ? '<div class="card-spec">規格：<b>'+it.spec+'</b></div>' : "";
    const price = it.price ? '<div class="card-price">'+it.price+' <small>元</small></div>' : "";
    const preHtml = (pre102||pre103) ? '<div class="card-pre">📅 預購：'+[pre102,pre103].filter(x=>x).join("；")+'</div>' : "";
    const notesHtml = notes ? '<div class="card-notes">'+notes+'</div>' : "";
    html += '<div class="card" data-search="'+b+' '+it.product+' '+(it.flavor||"")+'">';
    html += imgHtml;
    html += '<div class="card-body">';
    html += '<div class="card-brand">'+b+'</div>';
    html += '<div class="card-product">'+it.product+'</div>';
    html += flavor+spec+price+preHtml+notesHtml;
    html += '<div class="card-cta"><a href="ORDER_LINK" target="_blank">下單 →</a></div>';
    html += '</div></div>';
  });
  html += '</div></div>';
});
content.innerHTML = html;
function doSearch(q){
  q = q.toLowerCase().trim();
  let found = 0;
  document.querySelectorAll(".card").forEach(card=>{
    const match = !q || card.dataset.search.toLowerCase().includes(q);
    card.classList.toggle("hidden",!match);
    if(match) found++;
  });
  document.querySelectorAll(".brand-section").forEach(sec=>{
    sec.style.display = sec.querySelectorAll(".card:not(.hidden)").length>0?"":"none";
  });
  document.getElementById("noResult").classList.toggle("show",found===0&&q.length>0);
}
function openLB(img){
  const lb = document.getElementById("lightbox");
  const card = img.closest(".card");
  const prod = card ? card.querySelector(".card-product").textContent : "";
  document.getElementById("lbCaption").textContent = prod;
  document.getElementById("lbImg").src = img.src;
  lb.classList.add("show");
}
function closeLB(e){
  if(e.target.id==="lightbox"||e.target.classList.contains("lb-close")){
    document.getElementById("lightbox").classList.remove("show");
  }
}
window.addEventListener("scroll",()=>{
  let current = 0;
  BRANDS.forEach((b,i)=>{
    const el = document.getElementById("brand-"+i);
    if(el && el.getBoundingClientRect().top < 100) current = i;
  });
  document.querySelectorAll(".brand-nav a").forEach((a,i)=>a.classList.toggle("active",i===current));
},{passive:true});
</script>
